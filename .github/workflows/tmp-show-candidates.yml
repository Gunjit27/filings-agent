name: tmp show candidates
on:
  push:
    branches: [claude/project-thread-hxrdfd]
    paths: [.github/workflows/tmp-show-candidates.yml]
jobs:
  show:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-candidates
          run-id: 36242814495
          github-token: ${{ github.token }}
      - run: cat candidates.jsonl
