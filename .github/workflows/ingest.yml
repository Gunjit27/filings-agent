name: Ingest filings

# Downloads the annual reports in config/companies.yaml and indexes new ones into Qdrant Cloud.
on:
  workflow_dispatch:
    inputs:
      reindex:
        description: Re-embed documents that are already indexed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [config/companies.yaml]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Require Qdrant secrets
        run: |
          if [ -z "$QDRANT_URL" ]; then
            echo "::error::Add QDRANT_URL and QDRANT_API_KEY as repository secrets first."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('src/filings_agent/config.py') }}
      - run: uv sync
      - run: uv run python -m filings_agent.ingest.download
      - run: uv run python -m filings_agent.ingest.index ${{ inputs.reindex && '--reindex' || '' }}
      # Retrieval-only scores (no LLM calls): the current setup, then without the
      # reranker, then the old dense-only index, so each change's effect is visible.
      - name: Check retrieval
        run: |
          uv run python -m evals.retrieval | tee -a "$GITHUB_STEP_SUMMARY"
          RERANK_MODEL= uv run python -m evals.retrieval | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with the dense-only index
        continue-on-error: true
        run: QDRANT_COLLECTION=filings RERANK_MODEL= uv run python -m evals.retrieval | tee -a "$GITHUB_STEP_SUMMARY"
