[project]
name = "filings-agent"
version = "0.1.0"
description = "Citation-grounded research agent over Indian company filings (LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "litellm>=1.50",
    "mcp>=2.2",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langfuse>=2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_agent"]

[tool.ruff]
line-length = 100
